<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Calculadora</title>
    <!-- Inline icon: avoids a 404 for /favicon.ico when published under a subpath. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a63d6'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3E=%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator" aria-label="Calculadora">
      <div class="calculator__header">
        <h1 class="calculator__title">Calculadora</h1>
        <button type="button" class="history-toggle" id="history-toggle" aria-expanded="false" aria-controls="history">
          Histórico
        </button>
      </div>
      <section class="history" id="history" aria-label="Histórico de contas" hidden>
        <div class="history__header">
          <h2 class="history__title">Últimas contas</h2>
          <button type="button" class="history__clear" id="history-clear">Limpar histórico</button>
        </div>
        <p class="history__empty" id="history-empty">Nenhuma conta ainda</p>
        <ol class="history__list" id="history-list"></ol>
      </section>
      <div class="display-area">
        <div class="display" role="status" aria-live="polite" aria-atomic="true">
          <div class="display__expression" id="display-expression"></div>
          <div class="display__current" id="display-current" title="Tocar para copiar">0</div>
        </div>
        <button type="button" class="copy-button" id="copy-button" aria-label="Copiar resultado">Copiar</button>
        <p class="copy-toast" id="copy-toast" role="status" aria-live="polite"></p>
      </div>
      <div class="keypad">
        <button type="button" class="key key--clear" data-action="clear" aria-label="Limpar">C</button>
        <button type="button" class="key key--function" data-action="backspace" aria-label="Apagar último dígito">⌫</button>
        <button type="button" class="key key--function" data-action="percent" aria-label="Porcentagem">%</button>
        <button type="button" class="key key--operator" data-operator="/" aria-label="Dividir" aria-pressed="false">÷</button>
        <button type="button" class="key key--digit" data-digit="7">7</button>
        <button type="button" class="key key--digit" data-digit="8">8</button>
        <button type="button" class="key key--digit" data-digit="9">9</button>
        <button type="button" class="key key--operator" data-operator="*" aria-label="Multiplicar" aria-pressed="false">×</button>
        <button type="button" class="key key--digit" data-digit="4">4</button>
        <button type="button" class="key key--digit" data-digit="5">5</button>
        <button type="button" class="key key--digit" data-digit="6">6</button>
        <button type="button" class="key key--operator" data-operator="-" aria-label="Subtrair" aria-pressed="false">−</button>
        <button type="button" class="key key--digit" data-digit="1">1</button>
        <button type="button" class="key key--digit" data-digit="2">2</button>
        <button type="button" class="key key--digit" data-digit="3">3</button>
        <button type="button" class="key key--operator" data-operator="+" aria-label="Somar" aria-pressed="false">+</button>
        <button type="button" class="key key--digit key--wide2" data-digit="0">0</button>
        <button type="button" class="key key--digit" data-action="decimal" aria-label="Vírgula">,</button>
        <button type="button" class="key key--equals" data-action="equals" aria-label="Igual">=</button>
      </div>
    </main>
    <script src="src/calculator.js"></script>
    <script src="src/history.js"></script>
    <script src="src/keyboard.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
